spring:
  application:
    name: workflow-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/workflow_platform
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 2

workflow:
  worker:
    pool-size: 3
    lease-duration-seconds: 30
    recovery-poll-interval-ms: 5000

  dispatcher:
    poll-interval-ms: 1000

  retry:
    poll-interval-ms: 3000